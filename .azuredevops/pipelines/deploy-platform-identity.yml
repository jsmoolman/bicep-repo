trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/platform/identity/**
      - config/*/platform/identity-entra-groups.bicepparam
      - modules/org/**

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  deploymentUnit: platform/identity
  templateFile: src/platform/identity/entra-groups.bicep
  paramFile: config/nfi/platform/identity-entra-groups.bicepparam
  serviceConnection: sc-az-devops-trustedcloud-mgmt
  location: westeurope

stages:
  - template: ../templates/stages-plan-apply.yml
    parameters:
      deploymentUnit: ${{ variables.deploymentUnit }}
      templateFile: ${{ variables.templateFile }}
      paramFile: ${{ variables.paramFile }}
      deploymentScope: subscription
      location: ${{ variables.location }}
      serviceConnection: ${{ variables.serviceConnection }}
      environmentName: ${{ variables.deploymentUnit }}
