trigger:
  branches:
    include:
      - '*'

pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - bash: |
      set -euo pipefail
      shopt -s globstar nullglob
      files=(**/*.bicep)
      if [ ${#files[@]} -eq 0 ]; then
        echo "No .bicep files found — nothing to build or lint."
        exit 0
      fi
      status=0
      for f in "${files[@]}"; do
        echo "== bicep build: $f =="
        az bicep build --file "$f" --stdout > /dev/null || status=1
        echo "== bicep lint: $f =="
        az bicep lint --file "$f" || status=1
      done
      exit $status
    displayName: Bicep build and lint

  - bash: |
      set -euo pipefail
      shopt -s globstar nullglob
      files=(**/*.bicepparam)
      if [ ${#files[@]} -eq 0 ]; then
        echo "No .bicepparam files found — nothing to build."
        exit 0
      fi
      status=0
      for f in "${files[@]}"; do
        echo "== bicep build-params: $f =="
        az bicep build-params --file "$f" --stdout > /dev/null || status=1
      done
      exit $status
    displayName: Bicep parameter file validation

  - bash: |
      set -euo pipefail
      shopt -s globstar nullglob
      # Guards the identity boundary documented in docs/scope.md: no Entra/Graph
      # mutation, no tenant-wide RBAC, no management-group/subscription creation.
      #
      # Microsoft.Authorization/roleAssignments and Microsoft.Authorization/
      # roleDefinitions each have exactly one narrow, path-scoped exception:
      # the LIMS WS2025 compute-foundation module and entrypoint, approved in
      # docs/scope.md under "RBAC exception (VM login roles only)". The
      # roleDefinitions reference there is a read-only lookup of the two
      # built-in Virtual Machine Administrator/User Login role IDs via
      # subscriptionResourceId() — it declares no custom role definition.
      # Both patterns remain fully prohibited everywhere else in the
      # repository. Microsoft.Graph and Microsoft.Management/managementGroups
      # and Microsoft.Subscription/ have no exception and are blocked
      # everywhere, including in the LIMS paths.
      status=0

      blanket_pattern='Microsoft\.Graph/|Microsoft\.Management/managementGroups|Microsoft\.Subscription/'
      blanket_matches=$(grep -RInE "$blanket_pattern" --include='*.bicep' --include='*.bicepparam' . || true)
      if [ -n "$blanket_matches" ]; then
        echo "Prohibited resource types found in deployable Bicep files (see docs/scope.md):"
        echo "$blanket_matches"
        status=1
      fi

      rbac_exception_pattern='Microsoft\.Authorization/roleAssignments|Microsoft\.Authorization/roleDefinitions'
      rbac_exception_allowed_paths='^\./modules/compute/lims-ws2025-dev-foundation/main\.bicep:|^\./src/compute/lims-ws2025-dev-foundation/main\.bicep:'
      rbac_exception_matches=$(grep -RInE "$rbac_exception_pattern" --include='*.bicep' --include='*.bicepparam' . | grep -Ev "$rbac_exception_allowed_paths" || true)
      if [ -n "$rbac_exception_matches" ]; then
        echo "Prohibited Microsoft.Authorization/roleAssignments or roleDefinitions usage found outside the approved LIMS WS2025 compute-foundation exception (see docs/scope.md):"
        echo "$rbac_exception_matches"
        status=1
      fi

      if [ "$status" -eq 0 ]; then
        echo "No prohibited resource types found outside approved exceptions."
      fi
      exit $status
    displayName: Prohibited resource type guard
