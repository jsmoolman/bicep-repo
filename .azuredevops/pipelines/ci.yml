trigger:
  branches:
    include:
      - '*'

pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      # Guards the loadTextContent() 131,072-character hard limit (BCP184,
      # https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/bicep-functions-files#loadtextcontent)
      # with a conservative project budget, so a script-size regression fails
      # fast and clearly here instead of surfacing as a confusing downstream
      # BCP184/BCP062/BCP104 Bicep build error. Runs before Bicep build/lint.
      $projectBudget = 100000
      $bicepHardLimit = 131072

      $bicepFiles = @(Get-ChildItem -Path . -Recurse -Filter '*.bicep')
      if ($bicepFiles.Count -eq 0) {
        Write-Host 'No .bicep files found — nothing to check.'
        exit 0
      }

      $failed = $false
      $checked = 0
      foreach ($bicepFile in $bicepFiles) {
        $bicepText = Get-Content -Raw -LiteralPath $bicepFile.FullName
        $callMatches = [regex]::Matches($bicepText, "loadTextContent\(\s*'([^']+)'")
        foreach ($m in $callMatches) {
          $relativePath = $m.Groups[1].Value
          # loadTextContent() paths are resolved relative to the .bicep file
          # that contains the call, not the repository root or the CI working
          # directory.
          $targetPath = Join-Path $bicepFile.DirectoryName $relativePath
          $checked++

          if (-not (Test-Path -LiteralPath $targetPath -PathType Leaf)) {
            Write-Host "FAIL: $($bicepFile.FullName) calls loadTextContent('$relativePath'), but '$targetPath' does not exist. A missing referenced file is a hard failure, never a silent pass."
            $failed = $true
            continue
          }

          try {
            $bytes = [System.IO.File]::ReadAllBytes($targetPath)
            # Strip a UTF-8 BOM (EF BB BF) before decoding, matching the
            # character count every other tool in this repository reports
            # (e.g. Get-Content -Raw, which strips the BOM automatically) —
            # otherwise the BOM decodes as one extra U+FEFF character and the
            # count is inflated by one versus the file's actual content.
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              $bytes = $bytes[3..($bytes.Length - 1)]
            }
            # Strict UTF-8 decode: throws on invalid byte sequences instead of
            # silently substituting replacement characters, so a decode error
            # is a hard failure here rather than a silently wrong character count.
            $strictUtf8 = [System.Text.UTF8Encoding]::new($false, $true)
            $text = $strictUtf8.GetString($bytes)
          }
          catch {
            Write-Host "FAIL: could not decode '$targetPath' as strict UTF-8: $($_.Exception.Message). A decode error is a hard failure, never a silent pass."
            $failed = $true
            continue
          }

          # Conservative CRLF normalization: collapse any existing CRLF to a
          # single LF, then expand every remaining LF back to CRLF, so mixed
          # or LF-only line endings are measured as if every line ending were
          # CRLF (2 characters) — matching the convention used by Microsoft's
          # documented loadTextContent() character limit ("including line
          # endings").
          $normalized = ($text -replace "`r`n", "`n") -replace "`n", "`r`n"
          $length = $normalized.Length

          Write-Host "$($targetPath): $length characters (CRLF-normalized)"
          if ($length -gt $projectBudget) {
            Write-Host "FAIL: '$targetPath' is $length characters (CRLF-normalized), which exceeds this project's $projectBudget-character budget."
            Write-Host "The $projectBudget budget is a conservative margin below Bicep's documented $bicepHardLimit-character loadTextContent() hard limit (BCP184)."
            Write-Host 'Move explanatory comments/research prose into a companion Markdown document and keep the script lean, rather than compressing, minifying, generating a runtime copy, Base64-wrapping, or hosting it externally.'
            $failed = $true
          }
        }
      }

      Write-Host "Checked $checked loadTextContent() reference(s) across $($bicepFiles.Count) .bicep file(s)."
      if ($failed) { exit 1 }
      Write-Host 'All loadTextContent()-embedded scripts are within the project size budget.'
    displayName: loadTextContent() script-size guard

  - bash: |
      set -euo pipefail
      shopt -s globstar nullglob
      files=(**/*.bicep)
      if [ ${#files[@]} -eq 0 ]; then
        echo "No .bicep files found — nothing to build or lint."
        exit 0
      fi
      status=0
      for f in "${files[@]}"; do
        echo "== bicep build: $f =="
        az bicep build --file "$f" --stdout > /dev/null || status=1
        echo "== bicep lint: $f =="
        az bicep lint --file "$f" || status=1
      done
      exit $status
    displayName: Bicep build and lint

  - bash: |
      set -euo pipefail
      shopt -s globstar nullglob
      files=(**/*.bicepparam)
      if [ ${#files[@]} -eq 0 ]; then
        echo "No .bicepparam files found — nothing to build."
        exit 0
      fi
      status=0
      for f in "${files[@]}"; do
        echo "== bicep build-params: $f =="
        az bicep build-params --file "$f" --stdout > /dev/null || status=1
      done
      exit $status
    displayName: Bicep parameter file validation

  - bash: |
      set -euo pipefail
      shopt -s globstar nullglob
      # Guards the identity boundary documented in docs/scope.md: no Entra/Graph
      # mutation, no management-group/subscription creation, and no custom
      # Azure role-definition creation.
      #
      # Assigning an already-existing Entra principal to a built-in Azure role
      # (Microsoft.Authorization/roleAssignments, or a
      # subscriptionResourceId()/resourceId() reference to a built-in role
      # definition) is not an Entra ID mutation (see docs/scope.md, "RBAC and
      # Entra ID mutation are distinct") and is not guarded here — RBAC
      # assignment is governed by the "Explicit architecture decision
      # required" boundary in docs/scope.md, not by this automated guard. No
      # path-scoped exception is needed because these patterns are not
      # blocked in the first place.
      status=0

      blanket_pattern='Microsoft\.Graph/|Microsoft\.Management/managementGroups|Microsoft\.Subscription/'
      blanket_matches=$(grep -RInE "$blanket_pattern" --include='*.bicep' --include='*.bicepparam' . || true)
      if [ -n "$blanket_matches" ]; then
        echo "Prohibited resource types found in deployable Bicep files (see docs/scope.md):"
        echo "$blanket_matches"
        status=1
      fi

      # Matches only a literal resource-type/apiVersion declaration
      # (...roleDefinitions@<version>), i.e. creating or declaring `existing`
      # a Microsoft.Authorization/roleDefinitions resource — a custom role
      # definition. A subscriptionResourceId()/resourceId() string reference
      # to a built-in role has no trailing @<version> after the type, so it
      # never matches this pattern and is not blocked.
      role_definition_matches=$(grep -RInE 'Microsoft\.Authorization/roleDefinitions@' --include='*.bicep' --include='*.bicepparam' . || true)
      if [ -n "$role_definition_matches" ]; then
        echo "Prohibited custom Microsoft.Authorization/roleDefinitions resource declaration found (see docs/scope.md). A subscriptionResourceId()/resourceId() reference to a built-in role is allowed and would not match this:"
        echo "$role_definition_matches"
        status=1
      fi

      if [ "$status" -eq 0 ]; then
        echo "No prohibited resource types found."
      fi
      exit $status
    displayName: Prohibited resource type guard

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"
      # Pinned to the same versions verified locally against this
      # repository's guest-preparation scripts, for reproducibility.
      Install-Module -Name Pester -RequiredVersion 5.9.0 -Force -SkipPublisherCheck -Scope CurrentUser
      Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
      Import-Module Pester -RequiredVersion 5.9.0
      Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
      Write-Host "Pester version: $((Get-Module Pester).Version)"
      Write-Host "PSScriptAnalyzer version: $((Get-Module PSScriptAnalyzer).Version)"
    displayName: Install pinned PowerShell test tooling

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
      $scriptFiles = @(Get-ChildItem -Path . -Recurse -Filter '*.ps1' | Where-Object { $_.Name -notlike '*.Tests.ps1' })
      if ($scriptFiles.Count -eq 0) {
        Write-Host 'No PowerShell scripts found — nothing to analyze.'
        exit 0
      }
      $failed = $false
      foreach ($file in $scriptFiles) {
        # A script-colocated PSScriptAnalyzerSettings.psd1 (e.g. guest-runtime
        # PowerShell 5.1 compatibility checks) is used when present; otherwise
        # the full default ruleset applies.
        $settingsPath = Join-Path $file.DirectoryName 'PSScriptAnalyzerSettings.psd1'
        Write-Host "== PSScriptAnalyzer: $($file.FullName) =="
        if (Test-Path -LiteralPath $settingsPath) {
          $results = @(Invoke-ScriptAnalyzer -Path $file.FullName -Settings $settingsPath)
        }
        else {
          $results = @(Invoke-ScriptAnalyzer -Path $file.FullName)
        }
        if ($results.Count -gt 0) {
          $results | Format-Table -AutoSize RuleName, Severity, Line, Message
          $failed = $true
        }
      }
      if ($failed) { exit 1 }
      Write-Host 'No PSScriptAnalyzer issues found.'
    displayName: PowerShell static analysis (PSScriptAnalyzer)

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      Import-Module Pester -RequiredVersion 5.9.0
      $testFiles = @(Get-ChildItem -Path . -Recurse -Filter '*.Tests.ps1')
      if ($testFiles.Count -eq 0) {
        Write-Host 'No Pester test files found — nothing to run.'
        exit 0
      }
      $config = New-PesterConfiguration
      $config.Run.Path = $testFiles.FullName
      $config.Run.Exit = $true
      $config.Output.Verbosity = 'Detailed'
      Invoke-Pester -Configuration $config
    displayName: PowerShell unit tests (Pester)
