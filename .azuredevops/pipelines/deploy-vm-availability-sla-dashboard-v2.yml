# =============================================================================
# Deploy VM Availability SLA Dashboard v2
# =============================================================================
# Purpose:
#   Deploys the reusable VM Availability SLA Workbook v2 composition
#   (src/observability/vm-availability-sla-dashboard-v2/main.bicep) using a
#   project-specific parameter file. Defaults to this repository's example
#   configuration; accepts a different parameter-file path and service
#   connection so the same reusable module and entrypoint can be reused for
#   another project. Real deployments supply their own values for both.
#
# Manual only by design: trigger/pr are disabled; run via "Run pipeline" with
# an explicit what-if (default) or deploy action.
#
# Deployment steps are shared with the Cost Management Dashboard pipeline via
# templates/deploy-observability-workbook-steps.yml.
# =============================================================================

trigger: none

pr: none

parameters:
  - name: action
    displayName: Action to perform
    type: string
    default: what-if
    values:
      - what-if
      - deploy

  - name: serviceConnection
    displayName: Azure DevOps service connection (Contributor on the target subscription) — no default; the real value is customer-specific configuration
    type: string

  - name: parametersFile
    displayName: Path to the project-specific Bicep parameter file
    type: string
    default: 'config/example/observability/vm-availability-sla-dashboard-v2.bicepparam'

  - name: location
    displayName: Deployment location (subscription-scope deployment metadata location)
    type: string
    default: 'westeurope'

pool:
  vmImage: ubuntu-latest

steps:
  - template: templates/deploy-observability-workbook-steps.yml
    parameters:
      templateFile: 'src/observability/vm-availability-sla-dashboard-v2/main.bicep'
      deploymentNamePrefix: 'vm-availability-sla-dashboard-v2'
      action: ${{ parameters.action }}
      serviceConnection: ${{ parameters.serviceConnection }}
      parametersFile: ${{ parameters.parametersFile }}
      location: ${{ parameters.location }}
