# =============================================================================
# Deploy Cost Management Dashboard
# =============================================================================
# Purpose:
#   Deploys the reusable Cost Management Dashboard Workbook composition
#   (src/observability/cost-management-workbook/main.bicep) using a
#   project-specific parameter file. Defaults to the LIMS configuration but
#   accepts a different parameter-file path so the same reusable module and
#   entrypoint can later be reused for another NFI project. The workbook reads
#   exclusively from the CostManagementSnapshot_CL Log Analytics table — it
#   does not call the Azure Cost Management API itself.
#
# Commissioning note:
#   trigger/pr are intentionally disabled. This pipeline does not run
#   automatically on push or merge. It is run manually (Run pipeline) only
#   after a reviewed, explicit decision to validate or deploy. This capability
#   has not yet been validated against a live Cost Management/Log Analytics
#   endpoint — see docs/operations.md for outstanding runtime validation.
#
# Deployment steps are shared with the VM Availability SLA Dashboard v2
# pipeline via templates/deploy-observability-workbook-steps.yml — this file
# supplies only this capability's own defaults.
# =============================================================================

trigger: none

pr: none

parameters:
  - name: action
    displayName: Action to perform
    type: string
    default: what-if
    values:
      - what-if
      - deploy

  - name: serviceConnection
    displayName: Azure DevOps service connection (Contributor on the target subscription; this pipeline only deploys the workbook resource — it does not query Cost Management or the Log Analytics workspace itself)
    type: string
    default: 'sc-az-devops-trustedcloud-mgmt'

  - name: parametersFile
    displayName: Path to the project-specific Bicep parameter file
    type: string
    default: 'config/nfi/lims/observability/cost-management-workbook.bicepparam'

  - name: location
    displayName: Deployment location (subscription-scope deployment metadata location)
    type: string
    default: 'westeurope'

pool:
  vmImage: ubuntu-latest

steps:
  - template: templates/deploy-observability-workbook-steps.yml
    parameters:
      templateFile: 'src/observability/cost-management-workbook/main.bicep'
      deploymentNamePrefix: 'cost-management-workbook'
      action: ${{ parameters.action }}
      serviceConnection: ${{ parameters.serviceConnection }}
      parametersFile: ${{ parameters.parametersFile }}
      location: ${{ parameters.location }}
