# =============================================================================
# Deploy Cost Management Dashboard
# =============================================================================
# Deploys the Cost Management Dashboard Workbook composition
# (src/observability/cost-management-workbook/main.bicep) using a
# project-specific parameter file. Defaults to this repository's example
# configuration; accepts a different parameter-file path and service
# connection for reuse by another project.
#
# Manual only by design: trigger/pr are disabled. Run via "Run pipeline" with
# an explicit what-if (default) or deploy action.
#
# Deployment steps are shared with other workbook pipelines via
# templates/deploy-observability-workbook-steps.yml.
# =============================================================================

trigger: none

pr: none

parameters:
  - name: action
    displayName: Action to perform
    type: string
    default: what-if
    values:
      - what-if
      - deploy

  - name: serviceConnection
    displayName: Azure DevOps service connection (Contributor on the target subscription; this pipeline only deploys the workbook resource — it does not query Cost Management or the Log Analytics workspace itself) — no default; the real value is customer-specific configuration
    type: string

  - name: parametersFile
    displayName: Path to the project-specific Bicep parameter file
    type: string
    default: 'config/example/observability/cost-management-workbook.bicepparam'

  - name: location
    displayName: Deployment location (subscription-scope deployment metadata location)
    type: string
    default: 'westeurope'

pool:
  vmImage: ubuntu-latest

steps:
  - template: templates/deploy-observability-workbook-steps.yml
    parameters:
      templateFile: 'src/observability/cost-management-workbook/main.bicep'
      deploymentNamePrefix: 'cost-management-workbook'
      action: ${{ parameters.action }}
      serviceConnection: ${{ parameters.serviceConnection }}
      parametersFile: ${{ parameters.parametersFile }}
      location: ${{ parameters.location }}
