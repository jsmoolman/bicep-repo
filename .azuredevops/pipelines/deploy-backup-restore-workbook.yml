# =============================================================================
# Deploy Backup & Restore Dashboard
# =============================================================================
# Purpose:
#   Deploys the reusable Backup & Restore Dashboard Workbook composition
#   (src/observability/backup-restore-workbook/main.bicep) using a
#   project-specific parameter file. Defaults to this repository's example
#   configuration; accepts a different parameter-file path and service
#   connection for reuse by another project. The workbook reads exclusively
#   from three existing Azure Backup Log Analytics tables (AddonAzureBackupJobs,
#   CoreAzureBackup, AddonAzureBackupPolicy) — it makes no ARM, Resource Graph,
#   Cost Management, or Recovery Services API call, and this pipeline deploys
#   only the workbook resource: no Recovery Services Vault, backup policy,
#   protected item, diagnostic setting, or RBAC/identity mutation occurs here.
#
# Manual only by design: trigger/pr are disabled; run via "Run pipeline" with
# an explicit what-if (default) or deploy action.
#
# Deployment steps are shared with the VM Availability SLA Dashboard v2 and
# Cost Management Dashboard pipelines via
# templates/deploy-observability-workbook-steps.yml.
# =============================================================================

trigger: none

pr: none

parameters:
  - name: action
    displayName: Action to perform
    type: string
    default: what-if
    values:
      - what-if
      - deploy

  - name: serviceConnection
    displayName: Azure DevOps service connection (Contributor on the target subscription; this pipeline only deploys the workbook resource — it does not query the Log Analytics workspace itself) — no default; the real value is customer-specific configuration
    type: string

  - name: parametersFile
    displayName: Path to the project-specific Bicep parameter file
    type: string
    default: 'config/example/observability/backup-restore-workbook.bicepparam'

  - name: location
    displayName: Deployment location (subscription-scope deployment metadata location)
    type: string
    default: 'westeurope'

pool:
  vmImage: ubuntu-latest

steps:
  - template: templates/deploy-observability-workbook-steps.yml
    parameters:
      templateFile: 'src/observability/backup-restore-workbook/main.bicep'
      deploymentNamePrefix: 'backup-restore-workbook'
      action: ${{ parameters.action }}
      serviceConnection: ${{ parameters.serviceConnection }}
      parametersFile: ${{ parameters.parametersFile }}
      location: ${{ parameters.location }}
