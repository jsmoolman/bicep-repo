# =============================================================================
# Deploy Backup & Restore Dashboard
# =============================================================================
# Purpose:
#   Deploys the reusable Backup & Restore Dashboard Workbook composition
#   (src/observability/backup-restore-workbook/main.bicep) using a
#   project-specific parameter file. Defaults to the LIMS configuration but
#   accepts a different parameter-file path so the same reusable module and
#   entrypoint can later be reused for another NFI project. The workbook reads
#   exclusively from three existing Azure Backup Log Analytics tables
#   (AddonAzureBackupJobs, CoreAzureBackup, AddonAzureBackupPolicy) — it makes
#   no ARM, Azure Resource Graph, Cost Management, or Recovery Services API
#   call, and this pipeline deploys only the workbook resource: no Recovery
#   Services Vault, backup policy, protected item, diagnostic setting, or
#   RBAC/identity mutation occurs here.
#
# Commissioning note:
#   trigger/pr are intentionally disabled. This pipeline does not run
#   automatically on push or merge. It is run manually (Run pipeline) only
#   after a reviewed, explicit decision to validate or deploy. This capability
#   has not yet been validated against a live Log Analytics endpoint — see
#   docs/operations.md for outstanding runtime validation.
#
# Deployment steps are shared with the VM Availability SLA Dashboard v2 and
# Cost Management Dashboard pipelines via
# templates/deploy-observability-workbook-steps.yml — this file supplies only
# this capability's own defaults. No workbook-specific output assumption was
# copied blindly: this composition's entrypoint outputs the same
# workbookResourceId / workbookName / workbookDisplayName / workbookResourceGroupName
# names the shared template's deploy step already expects.
# =============================================================================

trigger: none

pr: none

parameters:
  - name: action
    displayName: Action to perform
    type: string
    default: what-if
    values:
      - what-if
      - deploy

  - name: serviceConnection
    displayName: Azure DevOps service connection (Contributor on the target subscription; this pipeline only deploys the workbook resource — it does not query the Log Analytics workspace itself)
    type: string
    default: 'sc-az-devops-trustedcloud-mgmt'

  - name: parametersFile
    displayName: Path to the project-specific Bicep parameter file
    type: string
    default: 'config/nfi/lims/observability/backup-restore-workbook.bicepparam'

  - name: location
    displayName: Deployment location (subscription-scope deployment metadata location)
    type: string
    default: 'westeurope'

pool:
  vmImage: ubuntu-latest

steps:
  - template: templates/deploy-observability-workbook-steps.yml
    parameters:
      templateFile: 'src/observability/backup-restore-workbook/main.bicep'
      deploymentNamePrefix: 'backup-restore-workbook'
      action: ${{ parameters.action }}
      serviceConnection: ${{ parameters.serviceConnection }}
      parametersFile: ${{ parameters.parametersFile }}
      location: ${{ parameters.location }}
