trigger:
	branches:
		include:
			- main
	paths:
		include:
			- src/workloads/lims/**
			- config/*/workloads/lims/*.bicepparam
			- modules/**

pr: none

pool:
	vmImage: ubuntu-latest

variables:
	deploymentUnit: workloads/lims
	templateFile: src/workloads/lims/main.bicep
	paramFile: config/nfi/workloads/lims/prd.bicepparam
	serviceConnection: sc-az-devops-trustedcloud-mgmt
	location: westeurope

stages:
	- template: ../templates/stages-plan-apply.yml
		parameters:
			deploymentUnit: ${{ variables.deploymentUnit }}
			templateFile: ${{ variables.templateFile }}
			paramFile: ${{ variables.paramFile }}
			deploymentScope: subscription
			location: ${{ variables.location }}
			serviceConnection: ${{ variables.serviceConnection }}
			environmentName: ${{ variables.deploymentUnit }}
