trigger:
	branches:
		include:
			- main
	paths:
		include:
			- src/workloads/mool/**
			- config/*/workloads/mool/*.bicepparam
			- modules/**

pr: none

pool:
	vmImage: ubuntu-latest

variables:
	deploymentUnit: workloads/mool
	templateFile: src/workloads/mool/main.bicep
	paramFile: config/fbi/workloads/mool/prd.bicepparam
	serviceConnection: sc-az-devops-trustedcloud-mgmt
	location: westeurope

stages:
	- template: ../templates/stages-plan-apply.yml
		parameters:
			deploymentUnit: ${{ variables.deploymentUnit }}
			templateFile: ${{ variables.templateFile }}
			paramFile: ${{ variables.paramFile }}
			deploymentScope: subscription
			location: ${{ variables.location }}
			serviceConnection: ${{ variables.serviceConnection }}
