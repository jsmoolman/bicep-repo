trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/platform/connectivity/private-dns-vnet-links.bicep
      - config/*/platform/private-dns-vnet-links.*.bicepparam
      - modules/platform/private-dns-vnet-link/**

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  deploymentUnit: platform/connectivity-dns
  environmentName: platform/connectivity-dns
  templateFile: src/platform/connectivity/private-dns-vnet-links.bicep
  paramFile: config/nfi/platform/private-dns-vnet-links.dev.bicepparam
  serviceConnection: sc-az-devops-trustedcloud-mgmt
  subscriptionId: 719f5040-fa8e-4b0a-bc2b-2e3fdc8163c2
  resourceGroupName: rg-dns
  location: westeurope

stages:
  - template: ../templates/stages-plan-apply.yml
    parameters:
      deploymentUnit: ${{ variables.deploymentUnit }}
      templateFile: ${{ variables.templateFile }}
      paramFile: ${{ variables.paramFile }}
      deploymentScope: resourceGroup
      subscriptionId: ${{ variables.subscriptionId }}
      resourceGroupName: ${{ variables.resourceGroupName }}
      location: ${{ variables.location }}
      serviceConnection: ${{ variables.serviceConnection }}
      environmentName: ${{ variables.environmentName }}
