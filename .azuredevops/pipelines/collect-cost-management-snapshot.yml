# =============================================================================
# Collect Cost Management Snapshot
# =============================================================================
# Runs the Cost Management -> LAW snapshot collector
# (scripts/observability/Invoke-CostManagementSnapshotCollector.ps1) for one
# billing month: one management-group Cost Management query, normalization,
# Environment mapping from repo config, and one Logs Ingestion API POST into
# CostManagementSnapshot_CL. Thin wrapper only — all logic lives in the script.
#
# Manual only: trigger/pr are disabled and there is no `schedules:` block.
# Performs exactly two API calls (one Cost Management query, one Logs
# Ingestion write); no deployment or RBAC/Entra/DCR mutation.
# =============================================================================

trigger: none

pr: none

parameters:
  - name: billingMonth
    displayName: Billing month to collect ('current' or an exact past YYYY-MM)
    type: string
    default: current

  - name: project
    displayName: Project name written into the Project column
    type: string
    default: example

  - name: costParametersFile
    displayName: Path to the Cost Management workbook parameter file (authoritative for managementGroupId / subscriptionEnvironmentMappings)
    type: string
    default: 'config/example/observability/cost-management-workbook.bicepparam'

  - name: foundationParametersFile
    displayName: Path to the LAW foundation parameter file (authoritative for workspaceResourceId / dataCollectionRuleName / tableName)
    type: string
    default: 'config/example/observability/cost-management-data-foundation.bicepparam'

  - name: serviceConnection
    displayName: Azure DevOps service connection (read access to Cost Management at managementGroupId scope; Monitoring Metrics Publisher at the DCR scope) — no default; the real value is customer-specific configuration
    type: string

  # Sent as the ClientType request header on the Cost Management API call.
  # Default is a compatibility-required identifier from an existing customer
  # deployment; a new deployment may override it with its own value.
  - name: clientType
    displayName: ClientType header value for the Cost Management API request
    type: string
    default: 'NFI-LIMS-CostCollector'

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: 'Run Cost Management snapshot collector'
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: pscore
      scriptLocation: scriptPath
      scriptPath: 'scripts/observability/Invoke-CostManagementSnapshotCollector.ps1'
      arguments: >-
        -CostParametersFile "${{ parameters.costParametersFile }}"
        -FoundationParametersFile "${{ parameters.foundationParametersFile }}"
        -Project "${{ parameters.project }}"
        -BillingMonth "${{ parameters.billingMonth }}"
        -ClientType "${{ parameters.clientType }}"
