# =============================================================================
# Migrate LIMS APP data-disk contents to the replacement APP VM
# =============================================================================
# Purpose:
#   The one reusable pipeline for copying existing LIMS APP data-disk
#   contents onto the replacement APP v2 A: volume. Selected by the
#   `action` parameter:
#     - `plan` (default, read-only): resolves and reports the exact source
#       disk, source and destination VM IDs, destination data disk, region,
#       Disk Encryption Set, and candidate temporary LUN. Fails closed if
#       any identity, attachment, or encryption check differs from the
#       reviewed environment mapping.
#     - `stage`: re-runs every plan check, requires the operator to record
#       whether this is an online capture or application writes were
#       quiesced, creates an incremental snapshot of the source disk,
#       creates a temporary disk from that snapshot, attaches it only to
#       APP v2 at the validated unused LUN, then submits the guest
#       Robocopy script via the shared Managed Run Command helper.
#     - `cleanup`: detaches and deletes only the temporary disk created by
#       the selected run, after verifying its resource ID and attachment.
#       Snapshot deletion is opt-in (default retain). Never touches the
#       original source disk or destination A:.
#
#   Environment differences live in
#   operations/compute/lims-app-data-disk-migration/LimsAppDataDiskMigration.Mapping.ps1
#   — not in this pipeline and not in a copied script. DEV is the only
#   enabled environment. tst, acc, preprd, and prd are already present in
#   the mapping (and in this pipeline's environment values) so they can be
#   onboarded by filling the reviewed mapping and setting Enabled = true.
#
#   Guest copy is delivered through the same
#   scripts/submit-and-wait-run-command.sh / scripts/cleanup-run-command.sh
#   mechanism the SQL provision pipeline uses. The guest script is
#   concatenated with the mapping file first so the guest independently
#   re-verifies destination identity against that same mapping.
#
#   Permissions: the Azure DevOps service connection reused below already
#   has customer-confirmed Owner access across all LIMS subscriptions.
#   This pipeline requires and grants no new permission.
#
#   Subscription is pinned explicitly on every az call inside the
#   control-plane script and the shared run-command helpers — never via
#   a silent az account set fallback.
#
# What this pipeline does NOT do:
#   - Start APP v2 services, or apply v2 JDBC / UNC / Apache / Shibboleth
#     permissions (those stay a later, separate review).
#   - Initialize or format any volume.
#   - Modify or delete the original source disk or the destination A:
#     volume.
#   - Delete the incremental snapshot unless deleteSnapshot is explicitly
#     true on cleanup.
#   - Duplicate this pipeline per environment.
#
# Time budget — same three aligned knobs as the SQL provision pipeline
# (hosted-agent default 60 minutes has not been confirmed higher):
#     guestTimeoutSeconds  = 2400 (40 min)
#     pollDeadlineSeconds  = 2700 (45 min)
#     job timeoutInMinutes = 60
#
# Manual only: trigger/pr are disabled; run via "Run pipeline".
# =============================================================================

trigger: none

pr: none

parameters:
  - name: serviceConnection
    displayName: Azure DevOps service connection — its underlying managed identity already has customer-confirmed Owner access across all LIMS subscriptions. This is a record of existing, already-confirmed access; this pipeline does not request, grant, or change any permission. No default; the real value is customer-specific configuration.
    type: string

  - name: environment
    displayName: Target environment from the reviewed mapping. Only an environment with Enabled = true in LimsAppDataDiskMigration.Mapping.ps1 will run; DEV is the only enabled environment.
    type: string
    default: 'dev'
    values:
      - dev
      - tst
      - acc
      - preprd
      - prd

  - name: action
    displayName: Migration action. 'plan' (default) is read-only. 'stage' snapshots, attaches, and copies. 'cleanup' removes only that run's temporary disk.
    type: string
    default: 'plan'
    values:
      - plan
      - stage
      - cleanup

  - name: captureMode
    displayName: "stage only, REQUIRED — record whether this capture is 'online' (source still writable) or 'writes-quiesced' (application writes were stopped for the capture window). Ignored for plan and cleanup. 'unspecified' is rejected by stage."
    type: string
    default: 'unspecified'
    values:
      - unspecified
      - online
      - writes-quiesced

  - name: migrationRunId
    displayName: "stage — leave empty to use this Build.BuildId; pass the original Build.BuildId to resume an interrupted stage. cleanup — REQUIRED; the stage run that created the temporary disk. Ignored for plan."
    type: string
    default: ''

  - name: deleteSnapshot
    displayName: 'cleanup only — when true, also delete this run''s incremental snapshot after verifying its resource ID. Default false (retain). Ignored for plan and stage.'
    type: boolean
    default: false

variables:
  - name: controlPlaneScriptPath
    value: 'operations/compute/lims-app-data-disk-migration/Invoke-LimsAppDataDiskMigration.ps1'
  - name: mappingScriptPath
    value: 'operations/compute/lims-app-data-disk-migration/LimsAppDataDiskMigration.Mapping.ps1'
  - name: guestCopyScriptPath
    value: 'operations/compute/lims-app-data-disk-migration/Copy-LimsAppDataDiskContents.ps1'
  - name: guestTimeoutSeconds
    value: '2400'
  - name: pollDeadlineSeconds
    value: '2700'
  - name: startupMaxRetries
    value: '20'
  - name: startupRetryIntervalSeconds
    value: '15'
  - name: normalPollIntervalSeconds
    value: '20'

jobs:
  - job: Migrate
    displayName: 'Migrate LIMS APP data-disk contents'
    timeoutInMinutes: 60
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self

      - bash: |
          set -euo pipefail
          action='${{ parameters.action }}'
          supplied='${{ parameters.migrationRunId }}'
          if [[ "$action" == "cleanup" ]]; then
            if [[ -z "$supplied" ]]; then
              echo "ERROR: parameters.migrationRunId is required for cleanup — pass the Build.BuildId of the stage run that created the temporary disk." >&2
              exit 1
            fi
            runId="$supplied"
          elif [[ -n "$supplied" ]]; then
            runId="$supplied"
          else
            runId="$(Build.BuildId)"
          fi
          echo "Effective migration run ID: $runId (action=$action)"
          echo "##vso[task.setvariable variable=effectiveMigrationRunId]$runId"
        displayName: 'Resolve migration run ID'

      - task: AzureCLI@2
        displayName: '${{ parameters.action }}: control-plane ${{ parameters.action }} against the reviewed ${{ parameters.environment }} mapping'
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          scriptType: pscore
          scriptLocation: scriptPath
          scriptPath: $(controlPlaneScriptPath)
          arguments: '-Action ${{ parameters.action }} -EnvironmentName ${{ parameters.environment }} -MigrationRunId $(effectiveMigrationRunId) -CaptureMode ${{ parameters.captureMode }} -DeleteSnapshot:$${{ parameters.deleteSnapshot }}'

      - ${{ if eq(parameters.action, 'stage') }}:
          - bash: |
              set -euo pipefail
              output="$(Agent.TempDirectory)/lims-app-mig-guest-$(effectiveMigrationRunId).ps1"
              bash .azuredevops/pipelines/scripts/prepare-lims-app-migration-guest-script.sh \
                "$(mappingScriptPath)" \
                "$(guestCopyScriptPath)" \
                "$output"
              echo "##vso[task.setvariable variable=guestScriptToSubmit]$output"
              echo "Prepared guest script at $output"
            displayName: 'stage: concatenate reviewed mapping into the guest copy script'

          - task: AzureCLI@2
            displayName: 'stage: submit guest copy script via Managed Run Command and wait for a terminal execution state'
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: '.azuredevops/pipelines/scripts/submit-and-wait-run-command.sh'
            env:
              DEV_SUBSCRIPTION_ID: $(limsAppMigSubscriptionId)
              RESOURCE_GROUP: $(limsAppMigResourceGroupName)
              VM_NAME: $(limsAppMigDestinationVmName)
              SCRIPT_TO_SUBMIT: $(guestScriptToSubmit)
              RUN_COMMAND_NAME: 'migrate-lims-app-data-$(effectiveMigrationRunId)'
              GUEST_TIMEOUT_SECONDS: $(guestTimeoutSeconds)
              POLL_DEADLINE_SECONDS: $(pollDeadlineSeconds)
              STARTUP_MAX_RETRIES: $(startupMaxRetries)
              STARTUP_RETRY_INTERVAL_SECONDS: $(startupRetryIntervalSeconds)
              NORMAL_POLL_INTERVAL_SECONDS: $(normalPollIntervalSeconds)
              RUN_COMMAND_PARAMETERS: |
                EnvironmentName=${{ parameters.environment }}
                MigrationRunId=$(effectiveMigrationRunId)
                ExpectedTemporaryLun=$(limsAppMigTemporaryLun)
                ExpectedTemporaryDiskName=$(limsAppMigTemporaryDiskName)
                CaptureMode=${{ parameters.captureMode }}

          - task: AzureCLI@2
            displayName: 'stage: record copy result on the destination VM'
            condition: succeededOrFailed()
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                if ([string]::IsNullOrWhiteSpace('$(limsAppMigTemporaryDiskId)')) {
                  Write-Output 'No temporary disk was recorded; skipping copy-status tag update.'
                  exit 0
                }
                $copyStatus = 'Failed'
                if ('$(Agent.JobStatus)' -eq 'Succeeded') { $copyStatus = 'Succeeded' }
                & '$(controlPlaneScriptPath)' -Action stage -EnvironmentName '${{ parameters.environment }}' -MigrationRunId '$(effectiveMigrationRunId)' -CaptureMode '${{ parameters.captureMode }}' -CopyStatus $copyStatus

      - ${{ if eq(parameters.action, 'stage') }}:
          - task: AzureCLI@2
            displayName: 'Delete the ad hoc Managed Run Command resource unless its result is indeterminate (best effort, always runs)'
            condition: always()
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: '.azuredevops/pipelines/scripts/cleanup-run-command.sh'
            env:
              DEV_SUBSCRIPTION_ID: $(limsAppMigSubscriptionId)
              RESOURCE_GROUP: $(limsAppMigResourceGroupName)
              VM_NAME: $(limsAppMigDestinationVmName)
              RUN_COMMAND_NAME: $(runCommandName)
              STAGING_INDETERMINATE: $(stagingIndeterminate)
