# =============================================================================
# Migrate LIMS APP data-disk contents to the replacement APP VM
# =============================================================================
# Purpose:
#   The one reusable pipeline for copying existing LIMS APP data-disk
#   contents onto the replacement APP v2 A: volume. Selected by the
#   `action` parameter:
#     - `plan` (default, read-only): resolves and reports the exact source
#       disk, source and destination VM IDs, destination data disk, region,
#       Disk Encryption Set, and candidate temporary LUN. Fails closed if
#       any identity, attachment, or encryption check differs from the
#       reviewed environment mapping.
#     - `attach-and-inspect`: re-runs every plan check, requires
#       captureMode `online` or `writes-quiesced`, snapshots only the
#       mapped source data disk, creates a temporary disk from that
#       snapshot, attaches it only to APP v2 at the validated unused LUN,
#       then submits the guest copy script with CollectInventoryOnly.
#       Guest inspection is read-only: it prints Azure ID / LUN / ARM
#       UniqueId beside the Windows inventory, requires an unambiguous
#       UniqueId match including A: = 60022480D1B07E6ACD98417F86591F4B,
#       and leaves the disk attached. No Set-Disk, drive-letter change,
#       init/format, Robocopy, or Azure Files access. Does not require
#       the stage/cleanup reparse gates.
#     - `stage`: re-runs every plan check, requires the operator to record
#       whether this is an online capture or application writes were
#       quiesced, creates an incremental snapshot of the source disk,
#       creates a temporary disk from that snapshot, attaches it only to
#       APP v2 at the validated unused LUN, then submits the guest
#       Robocopy script via the shared Managed Run Command helper.
#     - `cleanup`: detaches and deletes only the temporary disk created by
#       the selected run, after verifying its resource ID and attachment.
#       Snapshot deletion is opt-in (default retain). Never touches the
#       original source disk or destination A:.
#     - `configure-app`: after a completed copy, registers .\jboss-runner,
#       JBoss-8.0, Apache-2.4.57, shibd_Default, and the Azure Files
#       startup task on APP v2 only. Services stay stopped; automatic
#       startup is not enabled. Secrets come from variable group
#       lims-dev-app-v2-secrets, referenced only for this action.
#     - `activate-app`: separate access check of the reviewed UNC/link in
#       the scheduled-task and JBoss service contexts. Enables automatic
#       startup only after that check and the v2 JDBC/Apache/Shibboleth
#       reviews. Does not reference the secret variable group.
#
#   Environment differences live in
#   operations/compute/lims-app-data-disk-migration/LimsAppDataDiskMigration.Mapping.ps1
#   — not in this pipeline and not in a copied script. DEV is the only
#   enabled environment. tst, acc, preprd, and prd are already present in
#   the mapping (and in this pipeline's environment values) so they can be
#   onboarded by filling the reviewed mapping and setting Enabled = true.
#
#   Guest copy is delivered through the same
#   scripts/submit-and-wait-run-command.sh / scripts/cleanup-run-command.sh
#   mechanism the SQL provision pipeline uses. The guest script is
#   concatenated with the mapping and safety files first so the guest
#   independently re-verifies destination identity against that same
#   mapping. Stage and cleanup stay blocked until both
#   WindowsReparseValidationStatus and WindowsSymlinkValidationStatus
#   are Passed in the mapping. attach-and-inspect does not require those
#   gates. The per-environment lock is an If-Match update of the
#   destination VM lock tags, acquired before any snapshot or attach.
#   Disk create-or-update is not the lock. The inspect Run Command is
#   preserved until temporary-disk cleanup succeeds. Overlapping
#   attempts are refused even with the same migration run ID.
#
#   migrationRunId is passed only through task environment values and is
#   validated as a numeric Azure DevOps Build.BuildId before it is
#   published or used. Plan is read-only, including when the Disk
#   Encryption Set pin is missing (report live DES, then fail).
#
#   Permissions: the Azure DevOps service connection reused below already
#   has customer-confirmed Owner access across all LIMS subscriptions.
#   This pipeline requires and grants no new permission.
#
#   Subscription is pinned explicitly on every az call inside the
#   control-plane script and the shared run-command helpers — never via
#   a silent az account set fallback.
#
# What this pipeline does NOT do:
#   - Start APP v2 services during configure-app, or enable automatic
#     startup before activate-app plus the reviewed JDBC/Apache/Shibboleth
#     and UNC flags.
#   - Initialize or format any volume.
#   - Modify or delete the original source disk or the destination A:
#     volume.
#   - Delete the incremental snapshot unless deleteSnapshot is explicitly
#     true on cleanup.
#   - Duplicate this pipeline per environment.
#
# Time budget — same three aligned knobs as the SQL provision pipeline
# (hosted-agent default 60 minutes has not been confirmed higher):
#     guestTimeoutSeconds  = 2400 (40 min)
#     pollDeadlineSeconds  = 2700 (45 min)
#     job timeoutInMinutes = 60
#
# Manual only: trigger/pr are disabled; run via "Run pipeline".
# =============================================================================

trigger: none

pr: none

parameters:
  - name: serviceConnection
    displayName: Azure DevOps service connection — its underlying managed identity already has customer-confirmed Owner access across all LIMS subscriptions. This is a record of existing, already-confirmed access; this pipeline does not request, grant, or change any permission. No default; the real value is customer-specific configuration.
    type: string

  - name: environment
    displayName: Target environment from the reviewed mapping. Only an environment with Enabled = true in LimsAppDataDiskMigration.Mapping.ps1 will run; DEV is the only enabled environment.
    type: string
    default: 'dev'
    values:
      - dev
      - tst
      - acc
      - preprd
      - prd

  - name: action
    displayName: Migration action. 'plan' (default) is read-only. 'attach-and-inspect' snapshots, attaches to APP v2 LUN 1, and inspects read-only. 'stage' snapshots, attaches, and copies. 'cleanup' removes only that run's temporary disk. 'configure-app' registers APP v2 services after a completed copy. 'activate-app' is the separate startup-enablement check.
    type: string
    default: 'plan'
    values:
      - plan
      - attach-and-inspect
      - stage
      - cleanup
      - configure-app
      - activate-app

  - name: azureFilesUnc
    displayName: "configure-app / activate-app — explicit v2 Azure Files UNC for A:\\lv89\\sdmshome. Leave empty to skip link creation. Must match the reviewed mapping UNC after AzureFilesUncReviewStatus is Passed."
    type: string
    default: ''

  - name: captureMode
    displayName: "stage and attach-and-inspect, REQUIRED — record whether this capture is 'online' (source still writable) or 'writes-quiesced' (application writes were stopped for the capture window). Ignored for plan, cleanup, configure-app, and activate-app. 'unspecified' is rejected by stage and attach-and-inspect."
    type: string
    default: 'unspecified'
    values:
      - unspecified
      - online
      - writes-quiesced

  - name: migrationRunId
    displayName: "stage / attach-and-inspect — leave empty to use this Build.BuildId. Overlapping attempts with the same run ID are refused. cleanup — REQUIRED; the stage or attach-and-inspect Build.BuildId that created the temporary disk. Ignored for plan."
    type: string
    default: ''

  - name: deleteSnapshot
    displayName: 'cleanup only — when true, also delete this run''s incremental snapshot after verifying its resource ID. Default false (retain). Ignored for plan, attach-and-inspect, and stage.'
    type: boolean
    default: false

  - name: preSubmitRecovery
    displayName: 'cleanup only — reviewed recovery when attach-and-inspect ended before guest submission and the inspect Run Command never existed. Requires CopyStatus=InspectOnly, limsAppMigAttemptState=Prepared, the exact token limsAppMigGuestSubmitted=false, command NotFound, and this run holding the destination-VM lock. Missing or unknown GuestSubmitted values block. Default false. NotFound alone remains indeterminate.'
    type: boolean
    default: false

variables:
  - name: controlPlaneScriptPath
    value: 'operations/compute/lims-app-data-disk-migration/Invoke-LimsAppDataDiskMigration.ps1'
  - name: mappingScriptPath
    value: 'operations/compute/lims-app-data-disk-migration/LimsAppDataDiskMigration.Mapping.ps1'
  - name: safetyScriptPath
    value: 'operations/compute/lims-app-data-disk-migration/LimsAppDataDiskMigration.Safety.ps1'
  - name: guestCopyScriptPath
    value: 'operations/compute/lims-app-data-disk-migration/Copy-LimsAppDataDiskContents.ps1'
  - name: guestConfigureScriptPath
    value: 'operations/compute/lims-app-data-disk-migration/Configure-LimsAppV2.ps1'
  - ${{ if eq(parameters.action, 'configure-app') }}:
      - group: lims-dev-app-v2-secrets
  - name: guestTimeoutSeconds
    value: '2400'
  - name: pollDeadlineSeconds
    value: '2700'
  - name: startupMaxRetries
    value: '20'
  - name: startupRetryIntervalSeconds
    value: '15'
  - name: normalPollIntervalSeconds
    value: '20'

jobs:
  - job: Migrate
    displayName: 'Migrate LIMS APP data-disk contents'
    timeoutInMinutes: 60
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self

      - pwsh: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          . $env:LIMS_APP_MIG_SAFETY_SCRIPT
          $resolved = Resolve-LimsAppMigPipelineRunId -Action $env:LIMS_APP_MIG_ACTION -SuppliedRunId $env:LIMS_APP_MIG_RUN_ID_INPUT -BuildId $env:LIMS_APP_MIG_BUILD_ID
          if (-not $resolved.Accepted) {
            Write-Error $resolved.Reason
            exit 1
          }
          $runId = [string]$resolved.RunId
          if (-not [string]::IsNullOrEmpty($runId)) {
            $safe = Test-LimsAppMigPipelineSafeValue -Name 'effectiveMigrationRunId' -Value $runId
            if (-not $safe.Accepted) {
              Write-Error $safe.Reason
              exit 1
            }
          }
          Write-Output "Effective migration run ID: '$runId' (action=$($env:LIMS_APP_MIG_ACTION))"
          Write-Output "##vso[task.setvariable variable=effectiveMigrationRunId]$runId"
        displayName: 'Resolve migration run ID'
        env:
          LIMS_APP_MIG_ACTION: ${{ parameters.action }}
          LIMS_APP_MIG_RUN_ID_INPUT: ${{ parameters.migrationRunId }}
          LIMS_APP_MIG_BUILD_ID: $(Build.BuildId)
          LIMS_APP_MIG_SAFETY_SCRIPT: $(safetyScriptPath)

      - task: AzureCLI@2
        displayName: '${{ parameters.action }}: control-plane ${{ parameters.action }} against the reviewed ${{ parameters.environment }} mapping'
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          scriptType: pscore
          scriptLocation: scriptPath
          scriptPath: $(controlPlaneScriptPath)
        env:
          LIMS_APP_MIG_ACTION: ${{ parameters.action }}
          LIMS_APP_MIG_ENVIRONMENT: ${{ parameters.environment }}
          LIMS_APP_MIG_RUN_ID: $(effectiveMigrationRunId)
          LIMS_APP_MIG_CAPTURE_MODE: ${{ parameters.captureMode }}
          LIMS_APP_MIG_DELETE_SNAPSHOT: '${{ parameters.deleteSnapshot }}'
          LIMS_APP_MIG_PRE_SUBMIT_RECOVERY: '${{ parameters.preSubmitRecovery }}'
          LIMS_APP_MIG_BUILD_ID: $(Build.BuildId)

      - ${{ if eq(parameters.action, 'attach-and-inspect') }}:
          - bash: |
              set -euo pipefail
              output="${AGENT_TEMPDIRECTORY}/lims-app-mig-inspect-${EFFECTIVE_MIGRATION_RUN_ID}.ps1"
              bash .azuredevops/pipelines/scripts/prepare-lims-app-migration-guest-script.sh \
                "${MAPPING_SCRIPT_PATH}" \
                "${SAFETY_SCRIPT_PATH}" \
                "${GUEST_COPY_SCRIPT_PATH}" \
                "${output}"
              echo "##vso[task.setvariable variable=guestScriptToSubmit]${output}"
              echo "Prepared attach-and-inspect guest script at ${output}"
            displayName: 'attach-and-inspect: concatenate reviewed mapping and safety functions into the guest inspect script'
            env:
              EFFECTIVE_MIGRATION_RUN_ID: $(effectiveMigrationRunId)
              AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)
              MAPPING_SCRIPT_PATH: $(mappingScriptPath)
              SAFETY_SCRIPT_PATH: $(safetyScriptPath)
              GUEST_COPY_SCRIPT_PATH: $(guestCopyScriptPath)

          - task: AzureCLI@2
            displayName: 'attach-and-inspect: record guest submission before creating the Run Command'
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: pscore
              scriptLocation: scriptPath
              scriptPath: $(controlPlaneScriptPath)
            env:
              LIMS_APP_MIG_ACTION: attach-and-inspect
              LIMS_APP_MIG_ENVIRONMENT: ${{ parameters.environment }}
              LIMS_APP_MIG_RUN_ID: $(effectiveMigrationRunId)
              LIMS_APP_MIG_CAPTURE_MODE: ${{ parameters.captureMode }}
              LIMS_APP_MIG_MARK_GUEST_SUBMITTED: 'true'
              LIMS_APP_MIG_BUILD_ID: $(Build.BuildId)

          - task: AzureCLI@2
            displayName: 'attach-and-inspect: submit read-only guest inspect script via Managed Run Command and wait for a terminal execution state'
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: '.azuredevops/pipelines/scripts/submit-and-wait-run-command.sh'
            env:
              DEV_SUBSCRIPTION_ID: $(limsAppMigSubscriptionId)
              RESOURCE_GROUP: $(limsAppMigResourceGroupName)
              VM_NAME: $(limsAppMigDestinationVmName)
              SCRIPT_TO_SUBMIT: $(guestScriptToSubmit)
              RUN_COMMAND_NAME: $(limsAppMigGuestCommandName)
              GUEST_TIMEOUT_SECONDS: $(guestTimeoutSeconds)
              POLL_DEADLINE_SECONDS: $(pollDeadlineSeconds)
              STARTUP_MAX_RETRIES: $(startupMaxRetries)
              STARTUP_RETRY_INTERVAL_SECONDS: $(startupRetryIntervalSeconds)
              NORMAL_POLL_INTERVAL_SECONDS: $(normalPollIntervalSeconds)
              RUN_COMMAND_PARAMETERS: |
                EnvironmentName=$(limsAppMigEnvironmentName)
                MigrationRunId=$(effectiveMigrationRunId)
                ExpectedTemporaryLun=$(limsAppMigTemporaryLun)
                ExpectedTemporaryDiskName=$(limsAppMigTemporaryDiskName)
                ExpectedTemporaryDiskResourceId=$(limsAppMigTemporaryDiskId)
                ExpectedDestinationDiskResourceId=$(limsAppMigDestinationDiskId)
                ExpectedTemporaryDiskUniqueId=$(limsAppMigTemporaryDiskUniqueId)
                ExpectedDestinationDiskUniqueId=$(limsAppMigDestinationDiskUniqueId)
                CaptureMode=$(limsAppMigCaptureMode)
                CollectInventoryOnly=true

      - ${{ if eq(parameters.action, 'stage') }}:
          - bash: |
              set -euo pipefail
              output="${AGENT_TEMPDIRECTORY}/lims-app-mig-guest-${EFFECTIVE_MIGRATION_RUN_ID}.ps1"
              bash .azuredevops/pipelines/scripts/prepare-lims-app-migration-guest-script.sh \
                "${MAPPING_SCRIPT_PATH}" \
                "${SAFETY_SCRIPT_PATH}" \
                "${GUEST_COPY_SCRIPT_PATH}" \
                "${output}"
              echo "##vso[task.setvariable variable=guestScriptToSubmit]${output}"
              echo "Prepared guest script at ${output}"
            displayName: 'stage: concatenate reviewed mapping and safety functions into the guest copy script'
            env:
              EFFECTIVE_MIGRATION_RUN_ID: $(effectiveMigrationRunId)
              AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)
              MAPPING_SCRIPT_PATH: $(mappingScriptPath)
              SAFETY_SCRIPT_PATH: $(safetyScriptPath)
              GUEST_COPY_SCRIPT_PATH: $(guestCopyScriptPath)

          - task: AzureCLI@2
            displayName: 'stage: submit guest copy script via Managed Run Command and wait for a terminal execution state'
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: '.azuredevops/pipelines/scripts/submit-and-wait-run-command.sh'
            env:
              DEV_SUBSCRIPTION_ID: $(limsAppMigSubscriptionId)
              RESOURCE_GROUP: $(limsAppMigResourceGroupName)
              VM_NAME: $(limsAppMigDestinationVmName)
              SCRIPT_TO_SUBMIT: $(guestScriptToSubmit)
              RUN_COMMAND_NAME: $(limsAppMigGuestCommandName)
              GUEST_TIMEOUT_SECONDS: $(guestTimeoutSeconds)
              POLL_DEADLINE_SECONDS: $(pollDeadlineSeconds)
              STARTUP_MAX_RETRIES: $(startupMaxRetries)
              STARTUP_RETRY_INTERVAL_SECONDS: $(startupRetryIntervalSeconds)
              NORMAL_POLL_INTERVAL_SECONDS: $(normalPollIntervalSeconds)
              RUN_COMMAND_PARAMETERS: |
                EnvironmentName=$(limsAppMigEnvironmentName)
                MigrationRunId=$(effectiveMigrationRunId)
                ExpectedTemporaryLun=$(limsAppMigTemporaryLun)
                ExpectedTemporaryDiskName=$(limsAppMigTemporaryDiskName)
                ExpectedTemporaryDiskResourceId=$(limsAppMigTemporaryDiskId)
                ExpectedDestinationDiskResourceId=$(limsAppMigDestinationDiskId)
                ExpectedTemporaryDiskUniqueId=$(limsAppMigTemporaryDiskUniqueId)
                ExpectedDestinationDiskUniqueId=$(limsAppMigDestinationDiskUniqueId)
                CaptureMode=$(limsAppMigCaptureMode)

          - task: AzureCLI@2
            displayName: 'stage: record copy result on the destination VM'
            condition: succeededOrFailed()
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                if ([string]::IsNullOrWhiteSpace($env:LIMS_APP_MIG_TEMP_DISK_ID)) {
                  Write-Output 'No temporary disk was recorded; skipping copy-status tag update.'
                  exit 0
                }
                $copyStatus = 'Failed'
                if ($env:AGENT_JOBSTATUS -eq 'Succeeded') { $copyStatus = 'Succeeded' }
                $env:LIMS_APP_MIG_ACTION = 'stage'
                $env:LIMS_APP_MIG_COPY_STATUS = $copyStatus
                & $env:LIMS_APP_MIG_CONTROL_PLANE
            env:
              LIMS_APP_MIG_TEMP_DISK_ID: $(limsAppMigTemporaryDiskId)
              LIMS_APP_MIG_RUN_ID: $(effectiveMigrationRunId)
              LIMS_APP_MIG_ENVIRONMENT: $(limsAppMigEnvironmentName)
              LIMS_APP_MIG_CAPTURE_MODE: $(limsAppMigCaptureMode)
              LIMS_APP_MIG_CONTROL_PLANE: $(controlPlaneScriptPath)
              AGENT_JOBSTATUS: $(Agent.JobStatus)

      - ${{ if or(eq(parameters.action, 'configure-app'), eq(parameters.action, 'activate-app')) }}:
          - bash: |
              set -euo pipefail
              output="${AGENT_TEMPDIRECTORY}/lims-app-v2-configure-${EFFECTIVE_MIGRATION_RUN_ID}.ps1"
              bash .azuredevops/pipelines/scripts/prepare-lims-app-migration-guest-script.sh \
                "${MAPPING_SCRIPT_PATH}" \
                "${SAFETY_SCRIPT_PATH}" \
                "${GUEST_CONFIGURE_SCRIPT_PATH}" \
                "${output}"
              echo "##vso[task.setvariable variable=guestScriptToSubmit]${output}"
              echo "Prepared configuration guest script at ${output}"
            displayName: '${{ parameters.action }}: concatenate reviewed mapping and safety functions into the guest configuration script'
            env:
              EFFECTIVE_MIGRATION_RUN_ID: $(effectiveMigrationRunId)
              AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)
              MAPPING_SCRIPT_PATH: $(mappingScriptPath)
              SAFETY_SCRIPT_PATH: $(safetyScriptPath)
              GUEST_CONFIGURE_SCRIPT_PATH: $(guestConfigureScriptPath)

          - task: AzureCLI@2
            displayName: '${{ parameters.action }}: submit guest configuration script via Managed Run Command and wait for a terminal execution state'
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: '.azuredevops/pipelines/scripts/submit-and-wait-run-command.sh'
            env:
              DEV_SUBSCRIPTION_ID: $(limsAppMigSubscriptionId)
              RESOURCE_GROUP: $(limsAppMigResourceGroupName)
              VM_NAME: $(limsAppMigDestinationVmName)
              SCRIPT_TO_SUBMIT: $(guestScriptToSubmit)
              RUN_COMMAND_NAME: $(limsAppMigGuestCommandName)
              GUEST_TIMEOUT_SECONDS: $(guestTimeoutSeconds)
              POLL_DEADLINE_SECONDS: $(pollDeadlineSeconds)
              STARTUP_MAX_RETRIES: $(startupMaxRetries)
              STARTUP_RETRY_INTERVAL_SECONDS: $(startupRetryIntervalSeconds)
              NORMAL_POLL_INTERVAL_SECONDS: $(normalPollIntervalSeconds)
              RUN_COMMAND_PARAMETERS: |
                EnvironmentName=$(limsAppMigEnvironmentName)
                MigrationRunId=$(effectiveMigrationRunId)
                ConfigurePhase=$(limsAppMigConfigurePhase)
                ExpectedDestinationDiskResourceId=$(limsAppMigDestinationDiskId)
                ExpectedDestinationDiskUniqueId=$(limsAppMigDestinationDiskUniqueId)
                AzureFilesUnc=${{ parameters.azureFilesUnc }}
              ${{ if eq(parameters.action, 'configure-app') }}:
                RUN_COMMAND_PROTECTED_PARAMETERS: |
                  JbossRunnerPassword=$(jbossRunnerPassword)
                  AzureFilesAccessKey=$(azureFilesAccessKey)

      - ${{ if or(eq(parameters.action, 'stage'), eq(parameters.action, 'configure-app'), eq(parameters.action, 'activate-app')) }}:
          - task: AzureCLI@2
            displayName: 'Delete the ad hoc Managed Run Command resource unless its result is indeterminate (best effort, always runs)'
            condition: always()
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: '.azuredevops/pipelines/scripts/cleanup-run-command.sh'
            env:
              DEV_SUBSCRIPTION_ID: $(limsAppMigSubscriptionId)
              RESOURCE_GROUP: $(limsAppMigResourceGroupName)
              VM_NAME: $(limsAppMigDestinationVmName)
              RUN_COMMAND_NAME: $(runCommandName)
              STAGING_INDETERMINATE: $(stagingIndeterminate)
