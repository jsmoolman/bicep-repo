trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/platform/core/**
      - config/*/platform/core.bicepparam
      - modules/**

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  deploymentUnit: platform/core
  templateFile: src/platform/core/main.bicep
  paramFile: config/nfi/platform/core.bicepparam
  serviceConnection: sc-az-devops-trustedcloud-mgmt
  location: westeurope

stages:
  - template: ../templates/stages-plan-apply.yml
    parameters:
      deploymentUnit: ${{ variables.deploymentUnit }}
      templateFile: ${{ variables.templateFile }}
      paramFile: ${{ variables.paramFile }}
      deploymentScope: managementGroup
      managementGroupId: $(managementGroupId)
      location: ${{ variables.location }}
      serviceConnection: ${{ variables.serviceConnection }}
      environmentName: ${{ variables.deploymentUnit }}
