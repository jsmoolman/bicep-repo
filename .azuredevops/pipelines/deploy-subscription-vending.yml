trigger:
	branches:
		include:
			- main
	paths:
		include:
			- src/landing-zones/subscription-vending/**
			- config/*/landing-zones/*/subscription-vending.bicepparam
			- modules/**

pr: none

pool:
	vmImage: ubuntu-latest

variables:
	deploymentUnit: landing-zones/subscription-vending
	templateFile: src/landing-zones/subscription-vending/main.bicep
	paramFile: config/nfi/landing-zones/lims/subscription-vending.bicepparam
	serviceConnection: sc-az-devops-trustedcloud-mgmt
	managementGroupId: nfi-landingzones-corp
	location: westeurope

stages:
	- template: ../templates/stages-plan-apply.yml
		parameters:
			deploymentUnit: ${{ variables.deploymentUnit }}
			templateFile: ${{ variables.templateFile }}
			paramFile: ${{ variables.paramFile }}
			deploymentScope: managementGroup
			managementGroupId: ${{ variables.managementGroupId }}
			location: ${{ variables.location }}
			serviceConnection: ${{ variables.serviceConnection }}
