trigger:
	branches:
		include:
			- main
	paths:
		include:
			- src/platform/connectivity/**
			- config/*/platform/connectivity.westeurope.bicepparam
			- modules/**

pr: none

pool:
	vmImage: ubuntu-latest

variables:
	deploymentUnit: platform/connectivity
	templateFile: src/platform/connectivity/hub-spoke.bicep
	paramFile: config/fbi/platform/connectivity.westeurope.bicepparam
	serviceConnection: sc-az-devops-trustedcloud-mgmt
	location: westeurope

stages:
	- template: ../templates/stages-plan-apply.yml
		parameters:
			deploymentUnit: ${{ variables.deploymentUnit }}
			templateFile: ${{ variables.templateFile }}
			paramFile: ${{ variables.paramFile }}
			deploymentScope: subscription
			location: ${{ variables.location }}
			serviceConnection: ${{ variables.serviceConnection }}
