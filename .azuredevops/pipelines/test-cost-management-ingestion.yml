# =============================================================================
# TEMPORARY DIAGNOSTIC — synthetic Logs Ingestion API probe
# =============================================================================
# Purpose:
#   Prove that the deployed Cost Management LAW ingestion foundation (the
#   CostManagementSnapshot_CL custom table and its Direct-ingestion Data
#   Collection Rule) can actually accept a record through the Logs Ingestion
#   API, and that the pipeline identity already has the required
#   "Monitoring Metrics Publisher" role at the DCR's scope, before any real
#   scheduled collector is built. This pipeline sends exactly ONE synthetic,
#   clearly-fake record (SubscriptionId all-zeros, ServiceName "Synthetic
#   Ingestion Test", CollectionRunId "synthetic-ingestion-test") and does
#   nothing else.
#
#   This file is TEMPORARY. It must be removed before this feature branch is
#   ultimately merged.
#
# Cursor does not have customer Azure access and must not run this pipeline.
# It is synchronized manually to the customer Azure DevOps repository and run
# there by the user.
#
# -----------------------------------------------------------------------------
# Hard constraints (read before modifying)
# -----------------------------------------------------------------------------
#   - Exactly ONE Logs Ingestion API POST per pipeline run. No retries, no
#     loops, no polling, no backoff/sleep-then-retry.
#   - No Azure Cost Management API call of any kind.
#   - No az deployment/group/resource create — the table/DCR already exist;
#     this pipeline never (re)deploys them.
#   - No RBAC/Entra/identity change of any kind. If ingestion fails with
#     HTTP 403, that is a valid diagnostic result (missing role assignment
#     upstream of this pipeline) — it is reported, not worked around.
#   - Does not query the Log Analytics workspace. This pipeline only proves
#     that a write succeeds; reading the ingested row back is a separate,
#     later step (see docs/operations.md outstanding work).
# =============================================================================

trigger: none

pr: none

parameters:
  - name: dcrImmutableId
    displayName: Immutable ID of the deployed Data Collection Rule
    type: string
    default: 'dcr-2b4d2bd87e8437db5ea31bf6cca04fb'

  - name: ingestionEndpoint
    displayName: DCR Direct logs-ingestion endpoint (no trailing slash)
    type: string
    default: 'https://dcr-cost-snapshot-westeu-2tkp-westeurope.logs.z1.ingest.monitor.azure.com'

  - name: streamName
    displayName: DCR stream name that accepts CostManagementSnapshot_CL-shaped records
    type: string
    default: 'Custom-CostManagementSnapshot_CL'

  - name: apiVersion
    displayName: Logs Ingestion API version
    type: string
    default: '2023-01-01'

pool:
  vmImage: ubuntu-latest

steps:
  - task: AzureCLI@2
    displayName: 'Synthetic Logs Ingestion probe (single request, no retries)'
    inputs:
      azureSubscription: 'sc-az-devops-trustedcloud-mgmt'
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'

        # --- Fixed diagnostic inputs -------------------------------------------
        $dcrImmutableId    = '${{ parameters.dcrImmutableId }}'
        $ingestionEndpoint = '${{ parameters.ingestionEndpoint }}'
        $streamName        = '${{ parameters.streamName }}'
        $apiVersion        = '${{ parameters.apiVersion }}'

        Write-Host '== Cost Management synthetic Logs Ingestion probe =='
        Write-Host "DCR immutable ID: $dcrImmutableId"
        Write-Host "Ingestion endpoint: $ingestionEndpoint"
        Write-Host "Stream: $streamName"
        Write-Host "API version: $apiVersion"

        # --- Exactly one synthetic record, TimeGenerated set at run time ------
        $timeGenerated = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')

        $record = @{
          TimeGenerated   = $timeGenerated
          Project         = 'lims'
          SubscriptionId  = '00000000-0000-0000-0000-000000000000'
          Environment     = 'test'
          BillingMonth    = '2026-09-01T00:00:00Z'
          ServiceName     = 'Synthetic Ingestion Test'
          ActualCost      = 0.0
          Currency        = 'EUR'
          CollectionRunId = 'synthetic-ingestion-test'
        }

        Write-Host "Synthetic record TimeGenerated: $timeGenerated"

        # Logs Ingestion API always expects a JSON array of records, even for one.
        $body = ConvertTo-Json -InputObject @($record) -Depth 5

        $url = '{0}/dataCollectionRules/{1}/streams/{2}?api-version={3}' -f `
            $ingestionEndpoint.TrimEnd('/'),
            $dcrImmutableId,
            $streamName,
            $apiVersion
        Write-Host "Ingestion URL: $url"

        # --- Access token for the Logs Ingestion API (aud = monitor.azure.com,
        # not management.azure.com). Never printed.
        $token = az account get-access-token --resource https://monitor.azure.com/ --query accessToken -o tsv
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) {
          throw 'Failed to obtain a Monitor access token from the authenticated Azure CLI context.'
        }

        $headers = @{
          'Authorization' = "Bearer $token"
          'Content-Type'  = 'application/json'
        }

        # =========================================================================
        # EXACTLY ONE Logs Ingestion POST. No retries. No loops. No fallback.
        # =========================================================================
        $response = Invoke-WebRequest -Uri $url -Method Post -Headers $headers -Body $body -ContentType 'application/json' -SkipHttpErrorCheck
        $token = $null

        Write-Host "HTTP status: $($response.StatusCode)"

        $rawContent = $response.Content
        if ([string]::IsNullOrWhiteSpace($rawContent)) {
          Write-Host 'Response body: (empty)'
        }
        else {
          $compact = if ($rawContent.Length -gt 300) { $rawContent.Substring(0, 300) + '...' } else { $rawContent }
          Write-Host "Response body: $compact"
        }

        # --- Status-specific handling -------------------------------------------
        if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) {
          Write-Host 'RESULT: SUCCESS'
          exit 0
        }
        elseif ($response.StatusCode -eq 403) {
          Write-Host 'RESULT: FORBIDDEN (403)'
          Write-Host 'The pipeline identity may be missing the "Monitoring Metrics Publisher" role at this DCR''s scope. That RBAC assignment is outside this repository''s authority and is a separate customer/user action -- see docs/operations.md.'
          throw 'Logs Ingestion request returned HTTP 403. Not retrying.'
        }
        else {
          Write-Host "RESULT: UNEXPECTED HTTP STATUS $($response.StatusCode)"
          throw "Logs Ingestion request returned unexpected HTTP status $($response.StatusCode). Not retrying."
        }
