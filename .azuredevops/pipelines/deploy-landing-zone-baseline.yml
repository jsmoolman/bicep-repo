trigger:
	branches:
		include:
			- main
	paths:
		include:
			- src/landing-zones/baseline/**
			- config/*/landing-zones/*/baseline.*.bicepparam
			- modules/**

pr: none

pool:
	vmImage: ubuntu-latest

variables:
	deploymentUnit: landing-zones/baseline
	templateFile: src/landing-zones/baseline/main.bicep
	paramFile: config/nfi/landing-zones/lims/baseline.prd.bicepparam
	serviceConnection: sc-az-devops-trustedcloud-mgmt
	location: westeurope

stages:
	- template: ../templates/stages-plan-apply.yml
		parameters:
			deploymentUnit: ${{ variables.deploymentUnit }}
			templateFile: ${{ variables.templateFile }}
			paramFile: ${{ variables.paramFile }}
			deploymentScope: subscription
			location: ${{ variables.location }}
			serviceConnection: ${{ variables.serviceConnection }}
