parameters:
  - name: templateFile
    type: string
  - name: paramFile
    type: string
  - name: deploymentScope
    type: string
    default: resourceGroup
  - name: resourceGroupName
    type: string
    default: ''
  - name: subscriptionId
    type: string
    default: ''
  - name: managementGroupId
    type: string
    default: ''
  - name: location
    type: string
    default: westeurope
  - name: serviceConnection
    type: string
    default: sc-az-devops-trustedcloud-mgmt

steps:
  - task: AzureCLI@2
    displayName: Bicep what-if
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: pscore
      scriptLocation: scriptPath
      scriptPath: scripts/Invoke-BicepWhatIf.ps1
      arguments: >-
        -TemplateFile "${{ parameters.templateFile }}"
        -ParameterFile "${{ parameters.paramFile }}"
        -DeploymentScope "${{ parameters.deploymentScope }}"
        -ResourceGroupName "${{ parameters.resourceGroupName }}"
        -SubscriptionId "${{ parameters.subscriptionId }}"
        -ManagementGroupId "${{ parameters.managementGroupId }}"
        -Location "${{ parameters.location }}"
