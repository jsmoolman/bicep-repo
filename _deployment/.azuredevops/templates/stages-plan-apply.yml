parameters:
  - name: deploymentUnit
    type: string
  - name: templateFile
    type: string
  - name: paramFile
    type: string
  - name: deploymentScope
    type: string
    default: resourceGroup
  - name: resourceGroupName
    type: string
    default: ''
  - name: subscriptionId
    type: string
    default: ''
  - name: managementGroupId
    type: string
    default: ''
  - name: location
    type: string
    default: westeurope
  - name: serviceConnection
    type: string
    default: sc-az-devops-trustedcloud-mgmt
  - name: requireApproval
    type: boolean
    default: true

stages:
  - stage: Plan
    displayName: Plan — ${{ parameters.deploymentUnit }}
    jobs:
      - job: WhatIf
        displayName: What-if
        steps:
          - template: steps-bicep-validate.yml
            parameters:
              templateFile: ${{ parameters.templateFile }}
              paramFile: ${{ parameters.paramFile }}
              serviceConnection: ${{ parameters.serviceConnection }}

          - template: steps-bicep-whatif.yml
            parameters:
              templateFile: ${{ parameters.templateFile }}
              paramFile: ${{ parameters.paramFile }}
              deploymentScope: ${{ parameters.deploymentScope }}
              resourceGroupName: ${{ parameters.resourceGroupName }}
              subscriptionId: ${{ parameters.subscriptionId }}
              managementGroupId: ${{ parameters.managementGroupId }}
              location: ${{ parameters.location }}
              serviceConnection: ${{ parameters.serviceConnection }}

          - template: steps-psrule.yml

  - stage: Apply
    displayName: Apply — ${{ parameters.deploymentUnit }}
    dependsOn: Plan
    ${{ if parameters.requireApproval }}:
      jobs:
        - deployment: Deploy
          displayName: Deploy
          environment: ${{ parameters.deploymentUnit }}
          strategy:
            runOnce:
              deploy:
                steps:
                  - template: steps-bicep-deploy.yml
                    parameters:
                      templateFile: ${{ parameters.templateFile }}
                      paramFile: ${{ parameters.paramFile }}
                      deploymentScope: ${{ parameters.deploymentScope }}
                      resourceGroupName: ${{ parameters.resourceGroupName }}
                      subscriptionId: ${{ parameters.subscriptionId }}
                      managementGroupId: ${{ parameters.managementGroupId }}
                      location: ${{ parameters.location }}
                      serviceConnection: ${{ parameters.serviceConnection }}
    ${{ else }}:
      jobs:
        - job: Deploy
          displayName: Deploy
          steps:
            - template: steps-bicep-deploy.yml
              parameters:
                templateFile: ${{ parameters.templateFile }}
                paramFile: ${{ parameters.paramFile }}
                deploymentScope: ${{ parameters.deploymentScope }}
                resourceGroupName: ${{ parameters.resourceGroupName }}
                subscriptionId: ${{ parameters.subscriptionId }}
                managementGroupId: ${{ parameters.managementGroupId }}
                location: ${{ parameters.location }}
                serviceConnection: ${{ parameters.serviceConnection }}
