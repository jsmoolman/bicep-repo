# =============================================================================
# Deploy VM Availability SLA Workbook v2
# =============================================================================
# Purpose:
#   Deploys the Azure Monitor Workbook v2 (workbook-vm-availability-v2-lims-westeu)
#   into the same resource group as the central Log Analytics Workspace
#   (rg-lims-reports-mgmt-westeu).
#
#   v2 changes vs v1:
#     - Service window: Mon-Fri 08:00-17:00 Europe/Amsterdam (was 07:00-18:00)
#     - Planned maintenance support: logs written to PlannedMaintenance_CL
#       custom LAW table are excluded from SLA downtime calculations.
#       Reference numbers are surfaced in the Notes / Maintenance Ref columns.
#     - New columns: Planned Downtime Minutes (monthly) and Planned Minutes /
#       Maintenance Ref (daily).
#
# Logging planned maintenance (run before any maintenance window):
#   Use the Data Collector API, a Logic App, or the helper PowerShell below.
#   The table is created automatically on first ingestion.
#
#   Example PowerShell (replace <workspace-id> and <workspace-key>):
#
#     $body = @{
#       Environment      = "preprd"
#       MaintenanceStart = "2026-07-01T18:00:00Z"
#       MaintenanceEnd   = "2026-07-01T22:00:00Z"
#       ReferenceNumber  = "CHG-00423"
#       Reason           = "SQL Server upgrade"
#       LoggedBy         = "j.moolman@nfi.nl"
#     } | ConvertTo-Json
#
#     $date    = [DateTime]::UtcNow.ToString("r")
#     $content = [System.Text.Encoding]::UTF8.GetBytes($body)
#     $sig     = [System.Convert]::ToBase64String(
#       (New-Object System.Security.Cryptography.HMACSHA256(
#         [System.Convert]::FromBase64String("<workspace-key>")
#       )).ComputeHash(
#         [System.Text.Encoding]::UTF8.GetBytes("POST\n$($content.Length)\napplication/json\nx-ms-date:$date\n/api/logs")
#       ))
#     Invoke-RestMethod `
#       -Method Post `
#       -Uri "https://<workspace-id>.ods.opinsights.azure.com/api/logs?api-version=2016-04-01" `
#       -Headers @{
#           "Log-Type"      = "PlannedMaintenance"
#           "x-ms-date"     = $date
#           "Authorization" = "SharedKey <workspace-id>:$sig"
#       } `
#       -Body $body -ContentType "application/json"
#
# Prerequisites:
#   - deploy-monitoring-law.yml must have run successfully.
#
# After deployment:
#   Navigate to the central LAW in the Azure Portal →
#   Monitoring → Workbooks → workbook-vm-availability-v2-lims-westeu
# =============================================================================

name: deploy-monitoring-workbook-v2-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/landingzones/environments/monitoring-workbook.v2.bicep
      - infra/landingzones/modules/monitoring-workbook.v2.bicep
      - infra/landingzones/parameters/monitoring-workbook.v2.lims.parameters.json
      - infra/pipelines/deploy-monitoring-workbook.v2.yml

pr: none

parameters:
  - name: serviceConnection
    displayName: Azure DevOps service connection (Contributor on AZ-NFI-lims-mgt)
    type: string
    default: 'sc-lims-mgt'

  - name: subscriptionName
    displayName: Target subscription name (where the central LAW lives)
    type: string
    default: 'AZ-NFI-lims-mgt'

  - name: location
    displayName: Deployment location
    type: string
    default: 'westeurope'

variables:
  templateFile:    '$(Build.SourcesDirectory)/infra/landingzones/environments/monitoring-workbook.v2.bicep'
  parametersFile:  '$(Build.SourcesDirectory)/infra/landingzones/parameters/monitoring-workbook.v2.lims.parameters.json'
  deploymentName:  'lims-monitoring-workbook-v2-$(Build.BuildId)'

stages:
  # ---------------------------------------------------------------------------
  # Stage 1: Validate — what-if to confirm no unintended changes
  # ---------------------------------------------------------------------------
  - stage: Validate
    displayName: Validate workbook v2 deployment
    jobs:
      - job: WhatIf
        displayName: Run what-if against subscription
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'az deployment sub what-if'
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az deployment sub what-if \
                  --name "$(deploymentName)" \
                  --location "${{ parameters.location }}" \
                  --template-file "$(templateFile)" \
                  --parameters "$(parametersFile)"

  # ---------------------------------------------------------------------------
  # Stage 2: Deploy
  # ---------------------------------------------------------------------------
  - stage: Deploy
    displayName: Deploy workbook v2
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - deployment: DeployWorkbook
        displayName: Deploy workbook-vm-availability-v2-lims-westeu
        pool:
          vmImage: ubuntu-latest
        environment: 'lims-mgt'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  name: deployWorkbook
                  displayName: 'az deployment sub create'
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      outputs=$(az deployment sub create \
                        --name "$(deploymentName)" \
                        --location "${{ parameters.location }}" \
                        --template-file "$(templateFile)" \
                        --parameters "$(parametersFile)" \
                        --query properties.outputs \
                        --output json)

                      workbookResourceId=$(echo "$outputs"    | jq -r '.workbookResourceId.value')
                      workbookName=$(echo "$outputs"          | jq -r '.workbookName.value')
                      workbookDisplayName=$(echo "$outputs"   | jq -r '.workbookDisplayName.value')
                      workbookRg=$(echo "$outputs"            | jq -r '.workbookResourceGroupName.value')

                      echo "##vso[task.setvariable variable=workbookResourceId;isOutput=true]$workbookResourceId"
                      echo "##vso[task.setvariable variable=workbookName;isOutput=true]$workbookName"

                      echo "========================================="
                      echo "Workbook v2 deployed successfully"
                      echo "========================================="
                      echo "  Display name : $workbookDisplayName"
                      echo "  Resource ID  : $workbookResourceId"
                      echo "  Resource name: $workbookName"
                      echo "  Resource group: $workbookRg"
                      echo ""
                      echo "To open the workbook in the Azure Portal:"
                      echo "  1. Navigate to the central LAW (law-reports-mgmt-westeu)"
                      echo "  2. Go to Monitoring → Workbooks"
                      echo "  3. Select '$workbookDisplayName'"
                      echo ""
                      echo "To log planned maintenance windows see the pipeline comments"
                      echo "or use the PowerShell snippet in deploy-monitoring-workbook.v2.yml."
                      echo "========================================="
