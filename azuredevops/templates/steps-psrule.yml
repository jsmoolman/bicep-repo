parameters:
  - name: inputPath
    type: string
    default: src/

steps:
  - task: ps-rule-assert@2
    displayName: PSRule for Azure
    inputs:
      inputType: inputPath
      inputPath: ${{ parameters.inputPath }}
      modules: PSRule.Rules.Azure
      outputFormat: Sarif
      outputPath: reports/psrule-results.sarif
    continueOnError: false

  - task: PublishBuildArtifacts@1
    displayName: Publish PSRule SARIF report
    condition: always()
    inputs:
      pathToPublish: reports/psrule-results.sarif
      artifactName: psrule-report
